<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TODOカレンダー</title>
    <link rel="stylesheet" href="{{ url_for('main.static', filename='css/index.css') }}">
</head>
<body>
    <div id="header">
        <button id="prevBtn">← 前の月</button>
        <h1 id="monthTitle"></h1>
        <button id="nextBtn">次の月 →</button>
    </div>

    <div id="calendar"></div>

    <!-- モーダル -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span id="closeBtn" class="close">&times;</span>
            <h2 id="modalDate"></h2>
            <ul id="taskList"></ul>

            <!-- タスク追加欄 -->
            <input type="text" id="taskInput" placeholder="タスク名（空欄可）">
            <input type="text" id="detailInput" placeholder="詳細（空欄可）">
            <button id="addTaskButton">追加</button>
        </div>
    </div>

    <script src="{{ url_for('main.static', filename='js/index.js') }}"></script>
</body>
</html>
